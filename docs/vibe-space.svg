<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="vibeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#vibeBg)"/>

  <!-- Radar chart for vibe dimensions -->
  <g transform="translate(400, 200)">
    <!-- Rings -->
    <circle r="30" fill="none" stroke="#3498db" stroke-width="0.5" opacity="0.15"/>
    <circle r="60" fill="none" stroke="#3498db" stroke-width="0.5" opacity="0.15"/>
    <circle r="90" fill="none" stroke="#3498db" stroke-width="0.5" opacity="0.15"/>
    <circle r="120" fill="none" stroke="#3498db" stroke-width="0.5" opacity="0.15"/>
    <circle r="150" fill="none" stroke="#3498db" stroke-width="0.5" opacity="0.2"/>

    <!-- Axes (16 dimensions at 22.5° each) -->
    <g stroke="#3498db" stroke-width="0.5" opacity="0.2">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="57" y2="-139"/>
      <line x1="0" y1="0" x2="106" y2="-106"/>
      <line x1="0" y1="0" x2="139" y2="-57"/>
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="0" x2="139" y2="57"/>
      <line x1="0" y1="0" x2="106" y2="106"/>
      <line x1="0" y1="0" x2="57" y2="139"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-57" y2="139"/>
      <line x1="0" y1="0" x2="-106" y2="106"/>
      <line x1="0" y1="0" x2="-139" y2="57"/>
      <line x1="0" y1="0" x2="-150" y2="0"/>
      <line x1="0" y1="0" x2="-139" y2="-57"/>
      <line x1="0" y1="0" x2="-106" y2="-106"/>
      <line x1="0" y1="0" x2="-57" y2="-139"/>
    </g>

    <!-- Sample vibe shape (The Bar-Rail) -->
    <path d="M 0,-120 L 49,-119 L 85,-85 L 100,-41 L 75,30 L 106,106 L 28,68 L 0,45 L -49,119 L -85,85 L -60,-25 L -100,-41 L -75,-75 L -49,-119 Z"
          fill="#e94560" fill-opacity="0.1" stroke="#e94560" stroke-width="1.5" opacity="0.7"/>

    <!-- Dimension labels -->
    <g font-family="monospace" font-size="8" fill="#e8e8e8" opacity="0.4">
      <text x="0" y="-155" text-anchor="middle">warmth</text>
      <text x="60" y="-144" text-anchor="middle">tension</text>
      <text x="113" y="-112" text-anchor="middle">mystery</text>
      <text x="148" y="-62" text-anchor="middle">energy</text>
      <text x="160" y="3" text-anchor="middle">order</text>
      <text x="148" y="62" text-anchor="middle">openness</text>
      <text x="113" y="112" text-anchor="middle">intimacy</text>
      <text x="60" y="144" text-anchor="middle">novelty</text>
      <text x="0" y="160" text-anchor="middle">brightness</text>
      <text x="-60" y="144" text-anchor="middle">density</text>
      <text x="-113" y="112" text-anchor="middle">rhythm</text>
      <text x="-148" y="62" text-anchor="middle">resonance</text>
      <text x="-160" y="3" text-anchor="middle">gravity</text>
      <text x="-148" y="-62" text-anchor="middle">friction</text>
      <text x="-113" y="-112" text-anchor="middle">clarity</text>
      <text x="-60" y="-144" text-anchor="middle">depth</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="#e94560" opacity="0.8">🌊 VIBE PROTOCOL</text>
  <text x="20" y="48" font-family="monospace" font-size="10" fill="#3498db" opacity="0.5">16-dimensional room descriptors</text>
  <text x="20" y="380" font-family="monospace" font-size="9" fill="#e8e8e8" opacity="0.3">sample vibe: bar-rail (warm, intimate, rhythmic)</text>
</svg>
